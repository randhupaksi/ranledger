name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, build, and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ranledger_test
          POSTGRES_PASSWORD: synthetic_ci_password
          POSTGRES_DB: ranledger_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 3
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Report runner context
        run: |
          echo "Run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
          echo "Commit: $GITHUB_SHA"
          date -u --iso-8601=seconds
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 8

      - name: Lint
        run: npm run lint
        timeout-minutes: 4

      - name: Check formatting
        run: npm run format:check
        timeout-minutes: 4

      - name: Run unit tests
        run: npm run test
        timeout-minutes: 8
        env:
          TEST_DATABASE_URL: postgresql://ranledger_test:synthetic_ci_password@localhost:5432/ranledger_test

      - name: Type-check and build
        run: npm run build
        timeout-minutes: 8

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10

      - name: Run browser tests
        id: browser-tests
        run: npm run test:e2e
        timeout-minutes: 12

      - name: Upload browser failure diagnostics
        if: ${{ failure() && steps.browser-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/test-results/
            .cache/screenshots/
          if-no-files-found: ignore
          retention-days: 7
